name: edu AppImage

# Personal "Franken-build" of ossia/score.
#
# Default mode tracks the OPEN PULL REQUESTS I have on upstream (ossia/score):
# it merges each PR's head branch onto the latest upstream/master and builds a
# single Linux x86_64 AppImage, published to the `edu-build` release on this
# fork. Runs on a schedule so contributing a PR upstream is enough — no need to
# touch the fork to trigger a build.
#
# Lives ONLY on the orphan `edu-build` branch (the fork's default branch) so
# syncing `master` to upstream can never delete or conflict with it.
#
# Modes (branch_filter):
#   open-prs (default) -> branches that are head of an open PR I opened to ossia/score
#                         (drafts included: `gh pr list --state open` lists them)
#                         + the PRs of others listed in EXTRA_PRS, while they are open
#   all                -> every origin/edu/* branch on this fork (local WIP testing)
#
# Extra PRs: EXTRA_PRS lists PRs of other authors on ossia/score to merge too,
# in open-prs mode. Each one goes in only while it is open: once merged (or
# closed) it drops out of the build by itself, and a merged one is in
# upstream/master anyway. Clean the number out of the list at leisure.
#
# Add-ons: in open-prs mode, my open PRs on score add-on repositories (owners in
# ADDON_OWNERS; a repo counts as an add-on if it has an addon.json or score's
# ci/common.deps.sh clones it) are merged too. Each such add-on is cloned from
# its default branch into src/addons/<repo> after score's own add-on clones,
# and the PRs are merged onto it; a conflicting add-on PR is skipped the same
# way as a score PR.
#
# Conflicts (on_conflict):
#   skip (default) -> a PR that no longer merges onto upstream/master is left out
#                     of this build, with a warning; the release body says which.
#   fail           -> the old fail-fast behaviour: abort the whole build.

on:
  workflow_dispatch:
    inputs:
      branch_filter:
        description: "Which branches to include"
        type: choice
        default: open-prs
        options:
          - open-prs   # head branches of my open PRs to ossia/score
          - all        # every origin/edu/* branch on the fork
      force:
        description: "Rebuild even if nothing changed"
        type: boolean
        default: false
      on_conflict:
        description: "A PR that conflicts with upstream/master"
        type: choice
        default: skip
        options:
          - skip   # leave it out of this build, keep going
          - fail   # abort the whole build (fail-fast)
  schedule:
    - cron: '0 */3 * * *'   # every 3h; skips quickly when nothing changed

permissions:
  contents: write

concurrency:
  group: edu-appimage
  cancel-in-progress: true

env:
  UPSTREAM: ossia/score
  FORK: edumeneses/score
  CPU_ARCH: x86_64
  OUT_NAME: ossia.score-master-linux-x86_64-edu.AppImage
  STATE_NAME: edu-build-state.txt
  SUMMARY_NAME: edu-build-summary.md
  ADDON_OWNERS: ossia
  ADDON_PRS_NAME: edu-build-addon-prs.txt
  # Space-separated PR numbers on ossia/score by other authors, merged while open.
  #   2302: jcelerier's mixer console + execution telemetry
  EXTRA_PRS: "2302"
  # >>> sherpa-plugins injection — REMOVE this block AND the "Inject sherpa-plugins"
  #     step below once upstream score ships sherpa-plugins in src/addons/. <<<
  SHERPA_ADDON_REPO: sat-mtl/sherpa-plugins
  SHERPA_ADDON_REF: main
  SHERPA_ONNX_VERSION: "1.13.3"   # matches addon vendored header + its prebuilt-v<ver> release

jobs:
  edu-appimage:
    name: edu AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout edu-build
        uses: actions/checkout@v6
        with:
          ref: edu-build
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve sources, detect change, integrate
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_FILTER: ${{ inputs.branch_filter || 'open-prs' }}
          FORCE: ${{ inputs.force || 'false' }}
          ON_CONFLICT: ${{ inputs.on_conflict || 'skip' }}
        run: |
          set -euo pipefail
          git config user.name  "edu-build-ci"
          git config user.email "edu-build-ci@users.noreply.github.com"

          echo "::group::Fetch upstream/master"
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream master
          echo "::endgroup::"

          # --- Resolve the merge refs ------------------------------------------
          # MERGE_REFS = local refs to merge onto upstream/master, in order.
          echo "::group::Resolve refs (filter=$BRANCH_FILTER)"
          declare -a MERGE_REFS=()
          if [ "$BRANCH_FILTER" = "all" ]; then
            # Every edu/* branch on the fork (origin). Local WIP testing.
            git fetch --no-tags origin "+refs/heads/edu/*:refs/remotes/origin/edu/*" || true
            mapfile -t NAMES < <(git for-each-ref \
                --format='%(refname:lstrip=3)' refs/remotes/origin/edu/ | sort)
            for N in "${NAMES[@]:-}"; do
              [ -n "$N" ] && MERGE_REFS+=("origin/${N}")
            done
          else
            # All open PRs on upstream authored by edumeneses. The base repo
            # exposes every PR at refs/pull/<N>/head regardless of where the head
            # branch lives (an upstream branch or a fork), so a number-based
            # fetch is robust. Merge in ascending PR-number order.
            mapfile -t MINE < <(gh pr list --repo "$UPSTREAM" --state open \
                --author edumeneses --limit 300 --json number -q '.[].number')
            # Others' PRs from EXTRA_PRS, only while open.
            declare -a EXTRA=()
            for P in $EXTRA_PRS; do
              STATE=$(gh pr view "$P" --repo "$UPSTREAM" --json state -q .state) \
                || STATE=UNKNOWN
              if [ "$STATE" = "OPEN" ]; then
                EXTRA+=("$P")
              else
                echo "::notice::EXTRA_PRS: #$P is ${STATE,,}, left out (remove it from EXTRA_PRS)"
              fi
            done
            mapfile -t PRS < <(printf '%s\n' "${MINE[@]:-}" "${EXTRA[@]:-}" \
                | grep -E '^[0-9]+$' | sort -nu)
            for P in "${PRS[@]:-}"; do
              [ -n "$P" ] || continue
              git fetch --no-tags upstream "refs/pull/${P}/head:refs/remotes/pr/${P}"
              MERGE_REFS+=("pr/${P}")
            done
          fi
          echo "merge refs (${#MERGE_REFS[@]}): ${MERGE_REFS[*]:-(none)}"
          echo "::endgroup::"

          # --- Resolve add-on PRs ---------------------------------------------
          # One line per PR: "<owner/repo> <number> <head sha>", merged later,
          # after score's own add-on clones (Merge open add-on PRs step).
          echo "::group::Resolve add-on PRs (owners: $ADDON_OWNERS)"
          : > "$RUNNER_TEMP/$ADDON_PRS_NAME"
          if [ "$BRANCH_FILTER" != "all" ]; then
            OWNER_ARGS=()
            for O in $ADDON_OWNERS; do OWNER_ARGS+=(--owner "$O"); done
            DEPS=$(git show upstream/master:ci/common.deps.sh)
            while read -r REPO NUM; do
              [ -n "$REPO" ] || continue
              [ "$REPO" = "$UPSTREAM" ] && continue
              if ! grep -q "github.com/${REPO}\b" <<<"$DEPS" \
                 && ! gh api "repos/${REPO}/contents/addon.json" --silent 2>/dev/null; then
                echo "skip ${REPO}#${NUM}: not a score add-on"
                continue
              fi
              SHA=$(gh pr view "$NUM" --repo "$REPO" --json headRefOid -q .headRefOid)
              echo "${REPO} ${NUM} ${SHA}" >> "$RUNNER_TEMP/$ADDON_PRS_NAME"
            done < <(gh search prs --author edumeneses --state open "${OWNER_ARGS[@]}" \
                       --limit 200 --json repository,number \
                       -q '.[] | "\(.repository.nameWithOwner) \(.number)"' | sort -V)
          fi
          cat "$RUNNER_TEMP/$ADDON_PRS_NAME"
          echo "::endgroup::"

          # --- Change detection -------------------------------------------------
          echo "::group::Compute build state"
          {
            echo "filter=$BRANCH_FILTER"
            echo "upstream/master=$(git rev-parse upstream/master)"
            for R in "${MERGE_REFS[@]:-}"; do
              [ -n "$R" ] || continue
              echo "${R}=$(git rev-parse "$R")"
            done
            while read -r REPO NUM SHA; do
              [ -n "$REPO" ] && echo "addon:${REPO}#${NUM}=${SHA}"
            done < "$RUNNER_TEMP/$ADDON_PRS_NAME"
          } | sort > "$RUNNER_TEMP/new-state.txt"
          NEW_HASH=$(sha256sum "$RUNNER_TEMP/new-state.txt" | cut -d' ' -f1)
          echo "new state hash: $NEW_HASH"

          PREV_HASH=""
          if gh release download edu-build --repo "$FORK" \
               --pattern "$STATE_NAME" --dir "$RUNNER_TEMP" --clobber 2>/dev/null; then
            PREV_HASH=$(sha256sum "$RUNNER_TEMP/$STATE_NAME" | cut -d' ' -f1) || PREV_HASH=""
          fi
          echo "prev state hash: ${PREV_HASH:-(none)}"
          echo "::endgroup::"

          if [ "$NEW_HASH" = "$PREV_HASH" ] && [ "$FORCE" != "true" ]; then
            echo "No change since last build (and force=false). Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Persist the state file so the stage step can publish it.
          cp "$RUNNER_TEMP/new-state.txt" "$RUNNER_TEMP/$STATE_NAME"

          # --- Integrate: reset to upstream/master, merge branches (fail-fast) --
          echo "::group::Reset to upstream/master"
          git checkout -B edu-integration upstream/master
          git submodule update --init --recursive
          echo "::endgroup::"

          # Auto-resolve submodule pointer conflicts. Git only auto-merges the
          # trivial case (one pointer is an ancestor of the other), so when we
          # get here the pointers usually diverged: the PR bumped the submodule
          # and upstream moved it too. Resolution: take the newer commit when
          # ancestry holds, otherwise merge the two commits inside the
          # submodule and point the gitlink at the (local) merge result — the
          # build only needs the worktree, not a pushable commit. Regular file
          # conflicts and inner-merge conflicts stay hard failures.
          resolve_submodule_conflicts() {
            local path ours theirs pick
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              ours=$(git ls-files -u -- "$path" | awk '$1 == "160000" && $3 == 2 { print $2 }')
              theirs=$(git ls-files -u -- "$path" | awk '$1 == "160000" && $3 == 3 { print $2 }')
              if [ -z "$ours" ] || [ -z "$theirs" ]; then
                echo "conflict in '$path' is not a submodule pointer conflict"
                return 1
              fi
              # Both commits must exist locally; the initial submodule update
              # only fetched the commit recorded on upstream/master. A PR's
              # pointer may only be reachable from a pull ref on the submodule
              # repo, hence the second, broader fetch.
              git -C "$path" fetch --no-tags origin "$ours" "$theirs" 2>/dev/null \
                || git -C "$path" fetch --no-tags origin \
                     "+refs/heads/*:refs/remotes/origin/*" \
                     "+refs/pull/*/head:refs/remotes/origin-pr/*" 2>/dev/null || true
              if git -C "$path" merge-base --is-ancestor "$ours" "$theirs" 2>/dev/null; then
                pick=$theirs
              elif git -C "$path" merge-base --is-ancestor "$theirs" "$ours" 2>/dev/null; then
                pick=$ours
              else
                echo "submodule '$path' diverged (ours=$ours theirs=$theirs); merging inside the submodule"
                git -C "$path" checkout -q "$ours" 2>/dev/null || return 1
                if ! git -C "$path" -c user.name=edu-build-ci \
                       -c user.email=edu-build-ci@users.noreply.github.com \
                       merge --no-edit "$theirs"; then
                  git -C "$path" merge --abort || true
                  echo "submodule '$path': inner merge conflicts too, cannot auto-resolve"
                  return 1
                fi
                pick=$(git -C "$path" rev-parse HEAD)
              fi
              echo "submodule '$path': resolving to $pick"
              git update-index --cacheinfo "160000,$pick,$path" || return 1
            done < <(git diff --name-only --diff-filter=U)
            git commit --no-edit
          }

          declare -a MERGED=() SKIPPED=()
          for R in "${MERGE_REFS[@]:-}"; do
            [ -n "$R" ] || continue
            echo "::group::Merge $R"
            if git merge --no-edit "$R"; then
              echo "merged $R"
              MERGED+=("$R")
            elif resolve_submodule_conflicts; then
              echo "merged $R (auto-resolved submodule pointer conflict)"
              MERGED+=("$R")
            elif [ "$ON_CONFLICT" = "fail" ]; then
              echo "::error::Merge conflict on '$R'. Aborting (on_conflict=fail). Rebase that PR on upstream/master and retry."
              git merge --abort || true
              exit 1
            else
              echo "::warning::Merge conflict on '$R'; left out of this build (on_conflict=skip). Rebase that PR on upstream/master to get it back in."
              git merge --abort || true
              SKIPPED+=("$R")
            fi
            echo "::endgroup::"
          done
          git submodule update --init --recursive

          # --- Summary for the release body ---------------------------------------
          describe_ref() {
            # pr/<N> -> "#N title (by author) (draft)" ; anything else -> the ref name.
            # The author is named only for others' PRs, without an @ so the
            # release does not mention them.
            local R=$1
            if [[ "$R" =~ ^pr/([0-9]+)$ ]]; then
              local N=${BASH_REMATCH[1]}
              gh pr view "$N" --repo "$UPSTREAM" --json title,isDraft,author \
                -q '"#'"$N"' \(.title)"
                    + (if .author.login != "edumeneses" then " (by \(.author.login))" else "" end)
                    + (if .isDraft then " (draft)" else "" end)' \
                || echo "#$N"
            else
              echo "$R"
            fi
          }
          {
            echo "Personal integration build of ossia score: latest upstream/master + my open-PR branches (drafts included) + the open PRs of others listed in EXTRA_PRS. Linux x86_64 only. Auto-rebuilt on change."
            echo
            echo "upstream/master: \`$(git rev-parse --short upstream/master)\`"
            echo
            echo "Merged:"
            for R in "${MERGED[@]:-}"; do [ -n "$R" ] && echo "- $(describe_ref "$R") (\`$(git rev-parse --short "$R")\`)"; done
            [ ${#MERGED[@]} -gt 0 ] || echo "- (none)"
            if [ ${#SKIPPED[@]} -gt 0 ]; then
              echo
              echo "Left out, conflict with upstream/master (rebase to get them back in):"
              for R in "${SKIPPED[@]}"; do echo "- $(describe_ref "$R")"; done
            fi
          } > "$RUNNER_TEMP/$SUMMARY_NAME"
          cat "$RUNNER_TEMP/$SUMMARY_NAME"

      # >>> sherpa-plugins injection — REMOVE this whole step (and the env block
      #     above) once upstream score ships sherpa-plugins in src/addons/.
      #     score globs src/addons/*, so cloning the addon there compiles it into
      #     the build. The addon vendors its sherpa-onnx headers, so nothing extra
      #     is needed to COMPILE. The deploy build is STATIC (cninja default →
      #     SCORE_STATIC_PLUGINS), so the sherpa objects live in the ossia-score
      #     binary and dlopen libsherpa-onnx-c-api.so from get_module_folder() =
      #     the binary's dir (usr/bin). So we bundle the prebuilt C-API .so into
      #     usr/bin just before appimagetool packs the AppDir (libonnxruntime is
      #     found beside it via that lib's own $ORIGIN rpath).
      - name: Inject sherpa-plugins addon (temporary)
        if: steps.integrate.outputs.skip != 'true'
        run: |
          set -euxo pipefail
          # 1. addon source into the globbed addons dir
          git clone --depth 1 --branch "$SHERPA_ADDON_REF" \
            "https://github.com/${SHERPA_ADDON_REPO}.git" src/addons/sherpa-plugins
          rm -rf src/addons/sherpa-plugins/.git
          # 2. prebuilt C-API runtime libs (for packaging only, not compilation)
          curl -fL --retry 3 -o "$RUNNER_TEMP/sherpa-cabi.tgz" \
            "https://github.com/${SHERPA_ADDON_REPO}/releases/download/prebuilt-v${SHERPA_ONNX_VERSION}/sherpa-onnx-cabi-linux-x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/sherpa-cabi"
          tar xzf "$RUNNER_TEMP/sherpa-cabi.tgz" -C "$RUNNER_TEMP/sherpa-cabi"
          # 3. patch the (ephemeral) recipe to drop the libs into usr/bin pre-pack
          sed -i '\%^\./appimagetool%i cp -v '"$RUNNER_TEMP"'/sherpa-cabi/lib/*.so build/score.AppDir/usr/bin/' \
            ci/appimage.build.sh
      # <<< sherpa-plugins injection <<<

      - name: Dependencies
        if: steps.integrate.outputs.skip != 'true'
        run: ./ci/appimage.deps.sh

      # After Dependencies: ci/common.deps.sh clones score's add-ons there and
      # checks out their pinned refs, which would override an earlier checkout.
      - name: Merge open add-on PRs
        if: steps.integrate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -a MERGED=() SKIPPED=() PREPARED=()
          while read -r REPO NUM SHA; do
            [ -n "$REPO" ] || continue
            DIR="src/addons/${REPO##*/}"
            if [[ " ${PREPARED[*]:-} " != *" ${REPO} "* ]]; then
              echo "::group::Clone ${REPO}"
              sudo rm -rf "$DIR"
              git clone --recursive -j16 "https://github.com/${REPO}.git" "$DIR"
              PREPARED+=("$REPO")
              echo "::endgroup::"
            fi
            echo "::group::Merge ${REPO}#${NUM}"
            git -C "$DIR" fetch --no-tags origin "refs/pull/${NUM}/head:refs/remotes/pr/${NUM}"
            if git -C "$DIR" -c user.name=edu-build-ci \
                 -c user.email=edu-build-ci@users.noreply.github.com \
                 merge --no-edit "pr/${NUM}"; then
              MERGED+=("${REPO}#${NUM}")
            else
              echo "::warning::Merge conflict on ${REPO}#${NUM}; left out of this build."
              git -C "$DIR" merge --abort || true
              SKIPPED+=("${REPO}#${NUM}")
            fi
            git -C "$DIR" submodule update --init --recursive
            echo "::endgroup::"
          done < "$RUNNER_TEMP/$ADDON_PRS_NAME"

          describe() {
            local REPO=${1%#*} NUM=${1##*#}
            gh pr view "$NUM" --repo "$REPO" --json title,isDraft \
              -q '"'"${REPO}#${NUM}"' \(.title)" + (if .isDraft then " (draft)" else "" end)' \
              || echo "$1"
          }
          if [ ${#MERGED[@]} -gt 0 ] || [ ${#SKIPPED[@]} -gt 0 ]; then
            {
              echo
              echo "Add-on PRs merged:"
              for P in "${MERGED[@]:-}"; do [ -n "$P" ] && echo "- $(describe "$P")"; done
              [ ${#MERGED[@]} -gt 0 ] || echo "- (none)"
              if [ ${#SKIPPED[@]} -gt 0 ]; then
                echo
                echo "Add-on PRs left out, conflict with the add-on's default branch:"
                for P in "${SKIPPED[@]}"; do echo "- $(describe "$P")"; done
              fi
            } >> "$RUNNER_TEMP/$SUMMARY_NAME"
          fi
          cat "$RUNNER_TEMP/$SUMMARY_NAME"

      - name: Build
        if: steps.integrate.outputs.skip != 'true'
        run: |
          export GITTAGNOV=master
          ./ci/appimage.build.sh

      - name: Stage artifacts
        if: steps.integrate.outputs.skip != 'true'
        run: |
          set -eux
          mkdir -p staging
          mv "Score.AppImage" "staging/${OUT_NAME}"
          cp "$RUNNER_TEMP/${STATE_NAME}" "staging/${STATE_NAME}"
          cp "$RUNNER_TEMP/${SUMMARY_NAME}" "staging/${SUMMARY_NAME}"

      - name: Upload artifact
        if: steps.integrate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: edu-appimage-x86_64
          path: staging/${{ env.OUT_NAME }}

      - name: Publish to edu-build release
        if: steps.integrate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: edu-build
          name: "edu custom build"
          body_path: staging/${{ env.SUMMARY_NAME }}
          append_body: false
          generate_release_notes: false
          files: |
            staging/${{ env.OUT_NAME }}
            staging/${{ env.STATE_NAME }}
